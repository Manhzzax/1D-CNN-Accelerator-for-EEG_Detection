# Configuration file for EEG Seizure Detection 1D-CNN Pipeline (CHB-MIT version)

data:
  # The path to the raw CHB-MIT dataset folder (PhysioNet database)
  # Change this to the path on your training server
  raw_dir: "D:/Research/chb-mit-scalp-eeg-database-1.0.0/"
  
  # Output file name for the preprocessed numpy segments
  preprocessed_filename: "chbmit_preprocessed.npz"
  
  # Split ratios for train, validation, and test datasets
  split_ratios:
    train: 0.80
    val: 0.10
    test: 0.10
  seed: 42

model:
  num_classes: 2
  input_channels: 23     # CHB-MIT standard channels
  input_length: 256      # 1 second of EEG recording at 256 Hz

training:
  epochs: 30
  batch_size: 128
  learning_rate: 0.001
  weight_decay: 0.0001
  lr_patience: 3
  lr_factor: 0.5
  
  # Server-specific execution settings:
  num_workers: 4         # Number of subprocesses to use for data loading
  pin_memory: true       # Speed up CPU-to-GPU transfer (set True for GPU runs)
  use_amp: false         # Set True to enable Automatic Mixed Precision (FP16) on CUDA GPUs
  num_threads: 4         # Limit PyTorch CPU threads to avoid server core thrashing

quantization:
  q_scale_bits: 15        # Default fallback fractional bits
  clamp_min: -32768
  clamp_max: 32767
