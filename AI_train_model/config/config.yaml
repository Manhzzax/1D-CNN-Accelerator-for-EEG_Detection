# Configuration file for EEG Seizure Detection 1D-CNN Pipeline (CHB-MIT version)

data:
  # The path to the raw CHB-MIT dataset folder (PhysioNet database)
  # Change this to the path on your training server
  raw_dir: "D:/Research/chb-mit-scalp-eeg-database-1.0.0/"
  
  # Deprecated legacy output name. The locked-split builder writes one NPZ per split.
  preprocessed_filename: "chbmit_preprocessed.npz"

  # Directory under AI_train_model/data/ for immutable EDF/header audit artifacts
  audit_output_dir: "chbmit_audit"

  # Directory under AI_train_model/data/ for the split manifest locked before preprocessing
  protocol_output_dir: "chbmit_protocol"

  # Directory under AI_train_model/data/ for prepared train/validation/test windows
  prepared_output_dir: "chbmit_prepared_v1"

  # Created by train-only mixed hard-negative mining; select it with CHBMIT_PREPARED_OUTPUT_DIR.
  hard_negative_output_dir: "chbmit_prepared_mixed_hardneg_v1"
  
  # Split ratios for train, validation, and test datasets
  split_ratios:
    train: 0.70
    val: 0.10
    test: 0.20
  seed: 42

model:
  num_classes: 2
  input_channels: 17     # Locked canonical bipolar montage
  input_length: 256      # 1 second of EEG recording at 256 Hz

preprocessing:
  sample_rate_hz: 256
  window_sec: 1
  stride_sec: 1
  interictal_guard_sec: 30
  bandpass_low_hz: 0.5
  bandpass_high_hz: 45.0
  notch_hz: 60.0
  normal_to_seizure_ratio:
    train: 1.0
    val: 1.0
    test: 10.0

evaluation:
  # Empty means the baseline checkpoint in AI_train_model/outputs/.
  source_model_run_id: ""
  # Reuse score arrays only when writing a separate artifact run for the same source model.
  reuse_source_continuous_scores: true
  continuous_batch_size: 512
  threshold_min: 0.05
  threshold_max: 0.99
  threshold_step: 0.01
  refractory_sec: 30
  target_false_alarms_per_hour: 0.5
  # Select policy and threshold only on the validation recordings.
  temporal_policies:
    - name: "single_window"
      positive_windows: 1
      decision_window_windows: 1
    - name: "2_of_3"
      positive_windows: 2
      decision_window_windows: 3
    - name: "3_of_5"
      positive_windows: 3
      decision_window_windows: 5
    - name: "5_of_10"
      positive_windows: 5
      decision_window_windows: 10
    - name: "10_of_20"
      positive_windows: 10
      decision_window_windows: 20

hard_negative_mining:
  # Empty means the baseline in AI_train_model/outputs/.
  source_run_id: ""
  # Keep the original sampled 1:1 normal set, then add this many unique hard negatives.
  hard_negative_to_seizure_ratio: 2.0
  candidate_batch_size: 512

temporal_hard_negative_mining:
  # Mine only train recordings using score contexts from the selected run_03 model.
  source_run_id: "run_03_mixed_hardneg"
  # run_04 contains an unmodified cached train stream from this source model.
  score_cache_run_id: "run_04_score_tcn"
  output_dir: "chbmit_prepared_temporal_hardneg_v1"
  hard_negative_to_seizure_ratio: 1.0
  candidate_batch_size: 512
  threshold: 0.91
  decision_window_windows: 10
  min_hits_in_context: 3
  min_separation_sec: 10
  # Persistent false-alarm contexts can be rare; keep all available rather
  # than weakening the criterion merely to reach the requested ratio.
  allow_fewer_than_target: true

temporal_score_tcn:
  # Frozen 1-second CNN whose score stream becomes the TCN input.
  source_model_run_id: "run_03_mixed_hardneg"
  context_windows: 10
  hidden_channels: 8
  dropout: 0.1
  epochs: 30
  batch_size: 512
  learning_rate: 0.001
  weight_decay: 0.0001
  random_normal_to_seizure_ratio: 1.0
  hard_normal_to_seizure_ratio: 2.0
  early_stopping:
    min_epochs: 8
    patience: 6
    min_delta: 0.001

training:
  epochs: 30
  batch_size: 128
  learning_rate: 0.001
  weight_decay: 0.0001
  lr_patience: 3
  lr_factor: 0.5
  
  # Server-specific execution settings:
  num_workers: 4         # Number of subprocesses to use for data loading
  pin_memory: true       # Speed up CPU-to-GPU transfer (set True for GPU runs)
  use_amp: true          # RTX 8000 CUDA training uses Automatic Mixed Precision (FP16)
  num_threads: 4         # Limit PyTorch CPU threads to avoid server core thrashing
  class_balanced_batches: true
  early_stopping:
    enabled: true
    monitor: "val_loss"
    min_epochs: 8
    patience: 6
    min_delta: 0.001

quantization:
  q_scale_bits: 15        # Default fallback fractional bits
  clamp_min: -32768
  clamp_max: 32767
